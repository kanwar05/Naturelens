<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NatureLens offline</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f4efe7; color: #1f2d22; padding: 40px 20px; text-align: center; }
      .card { max-width: 520px; margin: 0 auto; background: #fffdf9; border: 1px solid #dbe7dc; border-radius: 16px; padding: 32px; }
      h1 { font-size: 2rem; margin-bottom: 12px; }
      p { line-height: 1.6; }
      a { color: #1f4d3a; }

  <body>
    <main class="card">
      <h1>You’re offline</h1>
      <p>NatureLens cached your shell, so you can still explore saved missions and journal notes while your connection is unavailable.</p>

    </main>
  </body>
